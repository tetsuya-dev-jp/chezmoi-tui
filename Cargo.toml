[package]
name = "chezmoi-tui"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A visual TUI wrapper around chezmoi"
repository = "https://github.com/tetsuya-dev-jp/chezmoi-tui"
documentation = "https://docs.rs/chezmoi-tui"
readme = "README.md"
keywords = ["chezmoi", "dotfiles", "tui", "cli", "ratatui"]
categories = ["command-line-utilities", "config"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_linux-x86_64.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_linux-aarch64.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_linux-x86_64-musl.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_linux-aarch64-musl.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_macos-aarch64.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }_{ version }_macos-x86_64.tar.gz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anyhow = "1.0.103"
brace-expand = "0.1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
ratatui = "0.30.2"
globset = "0.4.20"
regex = "1"
serde ={ version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0.1"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
pretty_assertions = "1.4"
